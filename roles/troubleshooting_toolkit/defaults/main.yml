---
# Base directories for storing diagnostics.
troubleshooting_remote_parent_dir: "/var/tmp/troubleshooting-toolkit"
troubleshooting_local_parent_dir: "{{ (playbook_dir | default('.')) ~ '/../artifacts/troubleshooting-toolkit' }}"

# Network diagnostics targets. Provide a list of dictionaries with at least an
# "address" key and optionally a "name" to describe the endpoint.
troubleshooting_targets: []
troubleshooting_ping_count: 5
troubleshooting_traceroute_options: "-n"
troubleshooting_curl_extra_args: "--fail --location --silent --show-error --output /dev/null"
troubleshooting_curl_format: "http_code=%{http_code} total_time=%{time_total} connect_time=%{time_connect}"

# Namespace specific verification.
troubleshooting_flagged_namespaces: []

# Optional restart behaviour. When enabled the resources listed in
# troubleshooting_restart_resources will be restarted with `kubectl rollout
# restart` in a controlled way.
troubleshooting_enable_restarts: false
troubleshooting_restart_resources: []

# Pod log capture defaults.
troubleshooting_pod_log_tail_lines: 500

# Workload selectors used to capture key control plane diagnostics. These can
# be extended per cluster.
troubleshooting_log_selectors:
  - name: cni
    namespace: kube-system
    selector: "k8s-app in (calico-node,cilium,flannel,aws-node,weave-net,canal,azure-ip-masq-agent,azure-cni-networkmonitor)"
  - name: kube-proxy
    namespace: kube-system
    selector: "k8s-app=kube-proxy"
  - name: coredns
    namespace: kube-system
    selector: "k8s-app in (kube-dns,coredns)"

# Host that should execute kubectl commands. When undefined the role attempts
# to pick the first host in the kube_control_plane group or falls back to the
# first host in the play.
troubleshooting_kubectl_delegate: null
