---
- name: Determine troubleshooting toolkit run identifier
  ansible.builtin.set_fact:
    troubleshooting_run_id: "{{ lookup('ansible.builtin.pipe', 'date +%Y%m%d%H%M%S') }}"
  run_once: true

- name: Share troubleshooting run identifier with all hosts
  ansible.builtin.set_fact:
    troubleshooting_run_id: "{{ hostvars[ansible_play_hosts_all[0]].troubleshooting_run_id }}"
  when: troubleshooting_run_id is not defined

- name: Resolve kubectl delegate host
  ansible.builtin.set_fact:
    troubleshooting_kubectl_delegate_resolved: >-
      {{
        troubleshooting_kubectl_delegate | default(
          (groups['kube_control_plane'] | default([])) | first | default(ansible_play_hosts_all[0])
        )
      }}
  run_once: true

- name: Record resolved kubectl delegate
  ansible.builtin.set_fact:
    troubleshooting_kubectl_delegate_resolved: "{{ hostvars[ansible_play_hosts_all[0]].troubleshooting_kubectl_delegate_resolved }}"
  when: troubleshooting_kubectl_delegate_resolved is not defined

- name: Prepare per-node diagnostics directory
  ansible.builtin.set_fact:
    troubleshooting_node_dir: >-
      {{ troubleshooting_remote_parent_dir }}/{{ troubleshooting_run_id }}/nodes/{{ inventory_hostname }}

- name: Create node diagnostics directories
  ansible.builtin.file:
    path: "{{ troubleshooting_node_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - network
    - system

- name: Include network collection tasks
  ansible.builtin.include_tasks: network.yml

- name: Include cluster-level diagnostics tasks
  ansible.builtin.include_tasks:
    file: cluster.yml
    apply:
      delegate_to: "{{ troubleshooting_kubectl_delegate_resolved }}"
      run_once: true

- name: Share cluster diagnostics tarball location
  ansible.builtin.set_fact:
    troubleshooting_cluster_tarball_path: "{{ hostvars[troubleshooting_kubectl_delegate_resolved].troubleshooting_cluster_tarball }}"
  run_once: true

- name: Package per-node diagnostics locally on each host
  ansible.builtin.shell: |
    set -o pipefail
    tar -czf "{{ troubleshooting_node_dir }}.tar.gz" -C "{{ troubleshooting_node_dir | dirname }}" "{{ troubleshooting_node_dir | basename }}"
  args:
    executable: /bin/bash
  changed_when: true

- name: Prepare local staging directory
  ansible.builtin.file:
    path: "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}/packages"
    state: directory
    mode: "0750"
  delegate_to: localhost
  run_once: true

- name: Retrieve packaged node diagnostics
  ansible.builtin.fetch:
    src: "{{ troubleshooting_node_dir }}.tar.gz"
    dest: "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}/packages/{{ inventory_hostname }}.tar.gz"
    flat: true

- name: Retrieve packaged cluster diagnostics
  ansible.builtin.fetch:
    src: "{{ troubleshooting_cluster_tarball_path }}"
    dest: "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}/packages/cluster.tar.gz"
    flat: true
  run_once: true
  delegate_to: "{{ troubleshooting_kubectl_delegate_resolved }}"

- name: Unpack node diagnostics on control host
  ansible.builtin.command:
    cmd: >-
      tar -xzf "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}/packages/{{ item }}.tar.gz"
      -C "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}"
  delegate_to: localhost
  loop: "{{ ansible_play_hosts_all }}"
  loop_control:
    label: "{{ item }}"
  run_once: true

- name: Unpack cluster diagnostics on control host
  ansible.builtin.command:
    cmd: >-
      tar -xzf "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}/packages/cluster.tar.gz"
      -C "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}"
  delegate_to: localhost
  run_once: true

- name: Create final troubleshooting tarball
  ansible.builtin.command:
    cmd: >-
      tar -czf "{{ troubleshooting_local_parent_dir }}/troubleshooting-{{ troubleshooting_run_id }}.tar.gz"
      -C "{{ troubleshooting_local_parent_dir }}/{{ troubleshooting_run_id }}" .
  delegate_to: localhost
  run_once: true
  changed_when: true
