---
- name: Run traceroute against each target
  ansible.builtin.shell: |
    set -o pipefail
    traceroute {{ troubleshooting_traceroute_options }} {{ item.address }} \
      > "{{ troubleshooting_node_dir }}/network/{{ (item.name | default(item.address)) | regex_replace('[^A-Za-z0-9_.-]', '_') }}-traceroute.txt" 2>&1 || true
  args:
    executable: /bin/bash
  loop: "{{ troubleshooting_targets }}"
  loop_control:
    label: "{{ item.name | default(item.address) }}"
  when: troubleshooting_targets | length > 0
  changed_when: true

- name: Run ping against each target
  ansible.builtin.shell: |
    set -o pipefail
    ping -c {{ troubleshooting_ping_count }} {{ item.address }} \
      > "{{ troubleshooting_node_dir }}/network/{{ (item.name | default(item.address)) | regex_replace('[^A-Za-z0-9_.-]', '_') }}-ping.txt" 2>&1 || true
  args:
    executable: /bin/bash
  loop: "{{ troubleshooting_targets }}"
  loop_control:
    label: "{{ item.name | default(item.address) }}"
  when: troubleshooting_targets | length > 0
  changed_when: true

- name: Run curl checks against each target
  ansible.builtin.shell: |
    set -o pipefail
    curl {{ troubleshooting_curl_extra_args }} --write-out '{{ troubleshooting_curl_format }}' "{{ item.address }}" \
      > "{{ troubleshooting_node_dir }}/network/{{ (item.name | default(item.address)) | regex_replace('[^A-Za-z0-9_.-]', '_') }}-curl.txt" 2>&1 || true
  args:
    executable: /bin/bash
  loop: "{{ troubleshooting_targets }}"
  loop_control:
    label: "{{ item.name | default(item.address) }}"
  when: troubleshooting_targets | length > 0
  changed_when: true
