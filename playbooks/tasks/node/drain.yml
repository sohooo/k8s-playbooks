---
# Drain workloads from a Kubernetes node with configurable daemonset and emptyDir handling.
- name: Determine drain timeout in seconds for {{ kube_node_name | default(inventory_hostname) }}
  ansible.builtin.set_fact:
    kube_drain_timeout_seconds: "{{ _kube_drain_timeout_seconds | int }}"
  vars:
    _timeout_input: "{{ kube_drain_timeout | default('10m') }}"
    _timeout_number: "{{ (_timeout_input | regex_search('^\\d+')) | default('10') | int }}"
    _timeout_unit: "{{ (_timeout_input | regex_search('[a-zA-Z]+$')) | default('m') | lower }}"
    _kube_drain_timeout_seconds: >-
      {% if _timeout_unit == 'h' %}
      {{ _timeout_number * 3600 }}
      {% elif _timeout_unit == 'm' %}
      {{ _timeout_number * 60 }}
      {% else %}
      {{ _timeout_number }}
      {% endif %}

- name: Drain {{ kube_node_name | default(inventory_hostname) }}
  community.kubernetes.k8s_drain:
    name: "{{ kube_node_name | default(inventory_hostname) }}"
    state: drained
    kubeconfig: "{{ kube_kubectl_delegate_kubeconfig_path }}"
    ignore_daemonsets: "{{ (not (kube_drain_include_daemonsets | default(false) | bool)) | bool }}"
    delete_emptydir_data: "{{ (kube_drain_delete_emptydir_data | default(true) | bool) }}"
    timeout: {{ kube_drain_timeout_seconds | int }}
  delegate_to: localhost
