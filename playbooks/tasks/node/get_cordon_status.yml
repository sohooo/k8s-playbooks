---
# Retrieve and expose the current schedulability state of a Kubernetes node.
- name: Query schedulability for {{ kube_node_name | default(inventory_hostname) }}
  community.kubernetes.k8s_info:
    api_version: v1
    kind: Node
    name: "{{ kube_node_name | default(inventory_hostname) }}"
    kubeconfig: "{{ kube_kubectl_delegate_kubeconfig_path }}"
  delegate_to: localhost
  register: kube_node_cordon_status
  failed_when: (kube_node_cordon_status.resources | default([])) | length == 0
  changed_when: false

- name: Cache schedulability fact for {{ kube_node_name | default(inventory_hostname) }}
  ansible.builtin.set_fact:
    kube_node_is_cordoned: "{{ ((kube_node_cordon_status.resources[0].spec.unschedulable | default(false)) | bool) }}"
