---
- name: Upgrade RKE2 server nodes
  hosts: kube_control_plane
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    kube_node_is_control_plane: true
    rke2_service_name: "rke2-server"
  tasks:
    - name: Run shared RKE2 upgrade workflow
      ansible.builtin.include_role:
        name: rke2
        tasks_from: upgrade

- name: Upgrade RKE2 agent nodes
  hosts: kube_workers
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    kube_node_is_control_plane: false
    rke2_service_name: "rke2-agent"
  tasks:
    - name: Run shared RKE2 upgrade workflow
      ansible.builtin.include_role:
        name: rke2
        tasks_from: upgrade
