        - name: Check for available system updates
          ansible.builtin.command:
            argv:
              - dnf
              - -q
              - check-update
          register: dnf_check_result
          changed_when: false
          failed_when: dnf_check_result.rc not in [0, 100]

        - name: Apply system updates
