---
- name: Rolling maintenance on RKE2 nodes
  hosts: kube_nodes
  become: true
  serial: 1
  order: inventory
  any_errors_fatal: true  # Halt the play entirely if any task fails to allow manual debugging
  tasks:
    - name: Run shared maintenance workflow
      ansible.builtin.include_role:
        name: rke2
        tasks_from: maintenance
