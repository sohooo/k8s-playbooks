---
- name: Maintenance on rke2 server nodes
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true  # Halt the play entirely if any task fails to allow manual debugging
  vars:
    kube_node_is_control_plane: "{{ controlplane | default(kube_control_plane) | default(false) | bool }}"
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/var/lib/rancher/rke2/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  pre_tasks:
    - name: Validate cluster scope before maintenance
      ansible.builtin.import_tasks: tasks/common/ensure_single_cluster.yml

    - name: Skip non-control-plane nodes for server maintenance
      when: not kube_node_is_control_plane
      ansible.builtin.meta: end_host
  tasks:
    - name: Run maintenance workflow for server nodes
      block: &node_maintenance_workflow
        - name: Capture node scheduling state before maintenance
          ansible.builtin.include_tasks:
            file: tasks/node/get_cordon_status.yml

        - name: Remember original scheduling state
          ansible.builtin.set_fact:
            kube_node_was_cordoned: "{{ kube_node_is_cordoned | default(false) | bool }}"

        - name: Ensure node is cordoned prior to maintenance
          when: not (kube_node_is_cordoned | default(false) | bool)
          ansible.builtin.include_tasks:
            file: tasks/node/cordon.yml

        - name: Drain workloads before running maintenance
          when: not (kube_node_was_cordoned | default(false) | bool)
          ansible.builtin.include_tasks:
            file: tasks/node/drain.yml

        - name: Execute Puppet maintenance
          ansible.builtin.import_tasks: tasks/common/puppet_agent.yml

        - name: Apply operating system updates
          ansible.builtin.import_tasks: tasks/common/dnf_update.yml

        - name: Restart node after maintenance
          ansible.builtin.import_tasks: tasks/common/reboot.yml

        - name: Refresh node scheduling state after reboot
          ansible.builtin.include_tasks:
            file: tasks/node/get_cordon_status.yml

        - name: Restore scheduling state if node was previously schedulable
          when: not (kube_node_was_cordoned | default(false) | bool) and (kube_node_is_cordoned | default(false) | bool)
          ansible.builtin.include_tasks:
            file: tasks/node/uncordon.yml

- name: Maintenance on rke2 agent nodes
  hosts: all
  become: true
  serial: 1
  any_errors_fatal: true  # Halt the play entirely if any task fails to allow manual debugging
  vars:
    kube_node_is_control_plane: "{{ controlplane | default(kube_control_plane) | default(false) | bool }}"
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/var/lib/rancher/rke2/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  pre_tasks:
    - name: Validate cluster scope before maintenance
      ansible.builtin.import_tasks: tasks/common/ensure_single_cluster.yml

    - name: Skip control-plane nodes for agent maintenance
      when: kube_node_is_control_plane
      ansible.builtin.meta: end_host
  tasks:
    - name: Determine available server delegates for this cluster
      ansible.builtin.set_fact:
        kube_cluster_server_candidates: >-
          {{
            (
              (
                (hostvars | dict2items)
                | selectattr('key', 'in', groups[kube_cluster] | default([]))
                | selectattr('value.controlplane', 'defined')
                | selectattr('value.controlplane')
                | map(attribute='key')
              )
              +
              (
                (hostvars | dict2items)
                | selectattr('key', 'in', groups[kube_cluster] | default([]))
                | selectattr('value.controlplane', 'undefined')
                | selectattr('value.kube_control_plane', 'defined')
                | selectattr('value.kube_control_plane')
                | map(attribute='key')
              )
            )
            | unique
            | list
          }}

    - name: Fail when no server delegate is available for the agent
      ansible.builtin.fail:
        msg: >-
          Unable to locate a control-plane host for {{ inventory_hostname }} in the {{ kube_cluster | default('undefined') }}
          cluster. Ensure the inventory defines at least one server node with controlplane=true.
      when: (kube_cluster_server_candidates | default([])) | length == 0

    - name: Determine kubectl delegate for agent nodes
      ansible.builtin.set_fact:
        kube_kubectl_delegate: "{{ kube_cluster_server_candidates[0] }}"
      when: (kube_cluster_server_candidates | default([])) | length > 0

    - name: Run maintenance workflow for agent nodes
      block: *node_maintenance_workflow
