---
- name: Label Kubernetes nodes with NVIDIA GPUs
  hosts: all
  become: true
  serial: 1
  vars:
    kube_node_is_control_plane: "{{ controlplane | default(false) | bool }}"
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/var/lib/rancher/rke2/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  pre_tasks:
    - name: Validate cluster scope before labeling
      ansible.builtin.import_tasks: tasks/common/ensure_single_cluster.yml

    - name: Select kubectl delegate for this cluster
      ansible.builtin.import_tasks: tasks/common/select_kubectl_delegate.yml

  tasks:
    - name: Count NVIDIA devices with lspci
      ansible.builtin.shell: |
        set -o pipefail
        lspci -d 10de: | wc -l
      args:
        executable: /bin/bash
      register: kube_node_gpu_count_result
      changed_when: false
      failed_when: kube_node_gpu_count_result.rc != 0

    - name: Record NVIDIA GPU facts
      ansible.builtin.set_fact:
        gpu_count: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int }}"
        gpu_present: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int > 0 }}"

    - name: Retrieve current node metadata for gpu label reconciliation
      community.kubernetes.k8s_info:
        api_version: v1
        kind: Node
        name: "{{ kube_node_name | default(inventory_hostname) }}"
        kubeconfig: "{{ kube_kubectl_delegate_kubeconfig_path }}"
      delegate_to: localhost
      register: kube_node_gpu_resource
      failed_when: (kube_node_gpu_resource.resources | default([])) | length == 0
      changed_when: false

    - name: Determine desired GPU label state
      ansible.builtin.set_fact:
        kube_node_desired_gpu_label: "{{ (gpu_present | bool) | ternary('on', 'off') }}"
        kube_node_current_gpu_label: "{{ kube_node_gpu_resource.resources[0].metadata.labels.gpu | default('') }}"

    - name: Reconcile gpu label on node
      community.kubernetes.k8s:
        api_version: v1
        kind: Node
        name: "{{ kube_node_name | default(inventory_hostname) }}"
        kubeconfig: "{{ kube_kubectl_delegate_kubeconfig_path }}"
        state: patched
        definition:
          metadata:
            labels:
              gpu: "{{ kube_node_desired_gpu_label }}"
        merge_type:
          - merge
      delegate_to: localhost
      when: kube_node_current_gpu_label != kube_node_desired_gpu_label
