---
- name: Label Kubernetes nodes with NVIDIA GPUs
  hosts: all
  become: true
  serial: 1
  vars:
    kube_node_is_control_plane: "{{ controlplane | default(false) | bool }}"
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/var/lib/rancher/rke2/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin') }}"
  pre_tasks:
    - name: Validate cluster scope before labeling
      ansible.builtin.import_tasks: tasks/common/ensure_single_cluster.yml

    - name: Gather available server delegates for this cluster
      ansible.builtin.set_fact:
        kube_cluster_server_candidates: >-
          {{
            (
              (hostvars | dict2items)
              | selectattr('key', 'in', groups[kube_cluster] | default([]))
              | selectattr('value.controlplane', 'defined')
              | selectattr('value.controlplane')
              | map(attribute='key')
            )
            | unique
            | list
          }}
      when: not kube_node_is_control_plane

    - name: Fail when no server delegate is available for this cluster
      ansible.builtin.fail:
        msg: >-
          Unable to locate a control-plane host for {{ inventory_hostname }} in the {{ kube_cluster | default('undefined') }}
          cluster. Ensure the inventory defines at least one server node with controlplane=true.
      when:
        - not kube_node_is_control_plane
        - (kube_cluster_server_candidates | default([])) | length == 0

    - name: Select kubectl delegate for worker nodes
      ansible.builtin.set_fact:
        kube_kubectl_delegate: "{{ kube_cluster_server_candidates[0] }}"
      when:
        - not kube_node_is_control_plane
        - (kube_cluster_server_candidates | default([])) | length > 0

  tasks:
    - name: Count NVIDIA devices with lspci
      ansible.builtin.shell: |
        set -o pipefail
        lspci -d 10de: | wc -l
      args:
        executable: /bin/bash
      register: kube_node_gpu_count_result
      changed_when: false
      failed_when: kube_node_gpu_count_result.rc != 0

    - name: Record NVIDIA GPU facts
      ansible.builtin.set_fact:
        gpu_count: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int }}"
        gpu_present: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int > 0 }}"

    - name: Retrieve current gpu label value
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - node
          - "{{ kube_node_name | default(inventory_hostname) }}"
          - -o
          - jsonpath={.metadata.labels.gpu}
      delegate_to: "{{ kube_kubectl_delegate | default(inventory_hostname) }}"
      register: kube_node_gpu_label_result
      changed_when: false
      failed_when: kube_node_gpu_label_result.rc != 0
      timeout: "{{ kube_kubectl_command_timeout | default(120) }}"

    - name: Ensure gpu=on label is applied
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - node
          - "{{ kube_node_name | default(inventory_hostname) }}"
          - gpu=on
          - --overwrite
      delegate_to: "{{ kube_kubectl_delegate | default(inventory_hostname) }}"
      register: kube_node_gpu_label_apply_result
      changed_when: true
      failed_when: kube_node_gpu_label_apply_result.rc != 0
      when: gpu_present | bool and (kube_node_gpu_label_result.stdout | default('')) != 'on'
      timeout: "{{ kube_kubectl_command_timeout | default(300) }}"

    - name: Ensure gpu=off label is applied when no GPU is present
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - node
          - "{{ kube_node_name | default(inventory_hostname) }}"
          - gpu=off
          - --overwrite
      delegate_to: "{{ kube_kubectl_delegate | default(inventory_hostname) }}"
      register: kube_node_gpu_label_remove_result
      changed_when: true
      failed_when: kube_node_gpu_label_remove_result.rc != 0
      when: not (gpu_present | bool) and (kube_node_gpu_label_result.stdout | default('')) != 'off'
      timeout: "{{ kube_kubectl_command_timeout | default(300) }}"
