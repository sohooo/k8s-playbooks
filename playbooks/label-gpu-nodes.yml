---
- name: Label Kubernetes nodes with NVIDIA GPUs
  hosts: all
  become: true
  serial: 1
  vars:
    kube_node_is_control_plane: "{{ controlplane | default(false) | bool }}"
  pre_tasks:
    - name: Prepare kubectl helpers
      ansible.builtin.include_role:
        name: kubectl
        tasks_from: setup

  tasks:
    - name: Count NVIDIA devices with lspci
      ansible.builtin.shell: |
        set -o pipefail
        lspci -d 10de: | wc -l
      args:
        executable: /bin/bash
      register: kube_node_gpu_count_result
      changed_when: false
      failed_when: kube_node_gpu_count_result.rc != 0

    - name: Record NVIDIA GPU facts
      ansible.builtin.set_fact:
        gpu_count: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int }}"
        gpu_present: "{{ (kube_node_gpu_count_result.stdout | default('0')) | trim | int > 0 }}"

    - name: Determine desired gpu label
      ansible.builtin.set_fact:
        gpu_label_desired: "{{ 'on' if gpu_present | bool else 'off' }}"

    - name: Retrieve current gpu label value
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - node
          - "{{ kube_node_name | default(inventory_hostname) }}"
          - -o
          - jsonpath={.metadata.labels.gpu}
      environment: "{{ kubectl_environment }}"
      delegate_to: "{{ kube_kubectl_delegate }}"
      register: kube_node_gpu_label_result
      changed_when: false
      failed_when: kube_node_gpu_label_result.rc != 0
      timeout: "{{ kube_kubectl_command_timeout | default(120) }}"

    - name: Ensure gpu label matches hardware state
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - node
          - "{{ kube_node_name | default(inventory_hostname) }}"
          - "gpu={{ gpu_label_desired }}"
          - --overwrite
      environment: "{{ kubectl_environment }}"
      delegate_to: "{{ kube_kubectl_delegate }}"
      changed_when: true
      when: (kube_node_gpu_label_result.stdout | default('')) != gpu_label_desired
      timeout: "{{ kube_kubectl_command_timeout | default(300) }}"
