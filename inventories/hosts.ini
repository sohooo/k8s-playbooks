# Static inventory describing managed RKE2 clusters.
# Each cluster group sets kube_cluster to simplify maintenance targeting.
[all:children]
kube_alpha
kube_bravo
kube_charlie

[kube_alpha:vars]
kube_cluster=kube_alpha

[kube_alpha]
kube01 controlplane=true
kube02 controlplane=true
kube03 controlplane=true
kube04
kube05

[kube_bravo:vars]
kube_cluster=kube_bravo

[kube_bravo]
kube06 controlplane=true
kube07 controlplane=true
kube08 controlplane=true
kube09
kube10

[kube_charlie:vars]
kube_cluster=kube_charlie

[kube_charlie]
kube11 controlplane=true
kube12 controlplane=true
kube13 controlplane=true
kube14
kube15
