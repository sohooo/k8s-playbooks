# Static inventory describing managed RKE2 clusters.
# Each cluster group sets kube_cluster to simplify maintenance targeting.
[all:children]
kube_alpha
kube_bravo
kube_charlie

[kube_alpha:vars]
kube_cluster=kube_alpha
kube_control_plane_group=kube_alpha_control_plane
kube_worker_group=kube_alpha_workers

[kube_alpha:children]
kube_alpha_control_plane
kube_alpha_workers

[kube_alpha_control_plane]
kube01
kube02
kube03

[kube_alpha_workers]
kube04
kube05

