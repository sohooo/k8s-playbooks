# Each cluster group sets kube_cluster so maintenance plays can verify
# that only one Kubernetes cluster is targeted at a time.
---
all:
  children:
    kube_alpha:
      vars:
        kube_cluster: kube_alpha
      children:
        server:
          hosts:
            "kube[01:03]":
        agent:
          hosts:
            "kube[04:05]":
    kube_bravo:
      vars:
        kube_cluster: kube_bravo
      children:
        server:
          hosts:
            "kube[06:08]":
        agent:
          hosts:
            "kube[09:10]":
    kube_charlie:
      vars:
        kube_cluster: kube_charlie
      children:
        server:
          hosts:
            "kube[11:13]":
        agent:
          hosts:
            "kube[14:15]":
